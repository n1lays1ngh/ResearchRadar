name: The Rinfo daily brief

on:
  schedule:
    # arXiv's RSS feed refreshes at midnight US Eastern (about 05:00 UTC), Monday to Friday.
    # On Saturday the same run sends the Week in Review, built from this week's briefs.
    - cron: "0 6 * * 1-6"   # 06:00 UTC = 11:30 IST, Monday to Saturday
  workflow_dispatch:
  repository_dispatch:
    types: [send-brief]

permissions:
  contents: write

concurrency:
  group: rinfo-commits   # shared with weekly-digest.yml
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_FALLBACK_BASE_URL: ${{ secrets.LLM_FALLBACK_BASE_URL }}
      LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
      LLM_FALLBACK_MODEL: ${{ secrets.LLM_FALLBACK_MODEL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      SITE_URL: ${{ vars.SITE_URL || vars.CHAT_APP_URL }}
      SUBSCRIBERS_KEY: ${{ secrets.SUBSCRIBERS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send the brief
        # Exit code 4 = the RSS feed couldn't be read; nothing was sent, so try once more.
        run: |
          set +e
          python run_brief.py
          code=$?
          if [ "$code" -eq 4 ]; then
            echo "::warning::arXiv RSS unreachable. Retrying in 5 minutes..."
            sleep 300
            python run_brief.py
            code=$?
          fi
          exit $code

      - name: Commit the brief (data/briefs/)
        run: |
          git config user.name "rinfo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefs
          if git diff --cached --quiet; then
            echo "No brief today"
          else
            git commit -m "Daily brief of $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
