name: Weekly Research Radar digest

on:
  schedule:
    - cron: "30 2 * * 1"   # Monday 02:30 UTC = 08:00 IST
  workflow_dispatch:
  repository_dispatch:
    types: [send-digest]   # webhook: POST /repos/OWNER/REPO/dispatches

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04   # pinned: avoids the ubuntu-latest -> 26 migration surprise
    timeout-minutes: 60
    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_FALLBACK_BASE_URL: ${{ secrets.LLM_FALLBACK_BASE_URL }}
      LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
      LLM_FALLBACK_MODEL: ${{ secrets.LLM_FALLBACK_MODEL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      CHAT_APP_URL: ${{ vars.CHAT_APP_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send digest
        # Exit code 4 = no papers (usually arXiv rate-limiting GitHub's shared IPs).
        # Nothing was sent in that case, so wait 10 minutes and try once more.
        run: |
          set +e
          python run_digest.py
          code=$?
          if [ "$code" -eq 4 ]; then
            echo "::warning::arXiv returned no papers (likely HTTP 429). Retrying in 10 minutes..."
            sleep 600
            python run_digest.py
            code=$?
          fi
          exit $code

      - name: Upload digest HTML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore

      - name: Commit data/latest.json
        run: |
          git config user.name "research-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No changes to data/latest.json"
          else
            git commit -m "Update digest data ($(date -u +%Y-%m-%d))"
            git push
          fi
